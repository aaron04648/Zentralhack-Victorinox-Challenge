services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./data/sak_ground_truth:/app/data/sak_ground_truth:ro   # Kundenfotos aus dem Input-PDF (Test)
    env_file:
      - path: .env        # API-Keys für Azure/OpenAI und Jev, siehe .env.example
        required: false
    environment:
      - CORS_ORIGINS=http://localhost:${FRONTEND_PORT:-3000}

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - API_TARGET=http://backend:8000
      # Erlaubt CORS-Requests von jeder Herkunft (Demo über Tailscale/Funnel).
      - CORS_ORIGINS=*
    depends_on:
      - backend
